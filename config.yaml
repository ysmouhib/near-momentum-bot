# Strategy configuration. Secrets (API keys) are NOT stored here -- they are
# read from the BINANCE_API_KEY / BINANCE_API_SECRET environment variables.
# Everything below is safe to commit and is what makes a run reproducible.

symbol: NEARUSDT
base_interval: 1m        # klines are fetched as 1m…
aggregate_minutes: 60    # …and aggregated to the trading timeframe (see docs/STRATEGY.md §2)
paper_trading: true      # true = Binance testnet; false = real funds
testnet_url: https://testnet.binance.vision

data:
  symbols: [NEARUSDT, ETHUSDT, SOLUSDT, BTCUSDT]   # download + validation universe
  start: "2023-01-01"    # fixed window, inclusive
  end: ""                # exclusive; empty = latest complete UTC day
  dir: data

strategy:
  # Momentum (vol-normalised time-series momentum, in bars)
  mom_fast: 36           # 36h ≈ 1.5 days
  mom_slow: 120          # 120h ≈ 5 days
  vol_window: 48         # realised-vol estimation window
  # Breakout (Donchian position in [-1, 1])
  bo_window: 48
  # Order flow (smoothed taker-imbalance z-score)
  ofi_window: 24
  # Blend weights
  w_mom: 0.50
  w_bo: 0.30
  w_ofi: 0.20
  # Regime gates
  er_window: 48          # Kaufman efficiency-ratio window
  er_min: 0.20           # below this the market is chop: no trades
  trend_window: 200      # long SMA filter: only long above it
  # Hysteresis (the cost-aware no-trade band)
  theta_in: 0.25
  theta_out: 0.0
  # Exits
  atr_period: 14
  trail_atr: 3.0         # chandelier stop: peak close - 3*ATR
  max_hold_bars: 168     # time stop (168h = 1 week)
  # Volatility-targeted sizing
  target_vol: 0.40       # annualised vol budget
  min_weight: 0.05       # skip entries sizing below this

risk:
  max_notional_frac: 0.95  # live: never deploy more than this of free USDT
  cooldown_bars: 0

# Risk overlay (docs/DESIGN.md §4): human permission switch + kill-switch
# ladder. These are a-priori risk policy, never optimised.
overlay:
  enabled: true              # paper/live force on; backtest/walkforward need --overlay
  per_trade_risk_frac: 0.006   # R per trade (0.6% of equity), keep in [0.005, 0.0075]
  max_exposure_frac: 0.40      # quarter-Kelly cap on invested notional
  hard_max_weight: 1.00        # structural: spot, no leverage
  daily_loss_halt_frac: -0.02  # vs UTC day-start equity -> no new entries today
  hwm_half_size_frac: -0.05    # drawdown from equity HWM -> half size
  hwm_half_clear_frac: -0.03   # ...cleared when drawdown recovers above this
  hwm_full_stop_frac: -0.10    # flatten everything, require human re-arm
  transition_size_mult: 0.5    # half size for the first trades after each arm
  cooldown_trades_after_arm: 3
  min_multiplier: 0.25
  journal_path: state/journal.csv
  state_path: state/overlay_state.json

# Validation battery (docs/DESIGN.md §7)
validation:
  train_days: 90
  test_days: 30
  top_k: 3
  bootstrap_reps: 10000
  bootstrap_block_bars: 168    # ~1 week of 60m bars
  journal_horizon_days: 5
  synthetic_accuracies: [0.5, 0.6, 0.7, 0.8]
  synthetic_schedules: 200

costs:
  taker_fee: 0.001       # 0.10% Binance spot taker (set 0.00075 if paying in BNB)
  slippage: 0.0002       # 0.02% assumed per side on market orders
